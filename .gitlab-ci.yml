###################
# DESTROY STAGE
###################

destroy:aws:
  extends: .aws_environment
  stage: destroy
  script:
    - |
      terraform destroy \
        -auto-approve \
        -var="region=${AWS_REGION}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual  # Always require manual trigger for destroy
  dependencies: []

destroy:kubernetes:
  extends: .kubernetes_environment
  stage: destroy
  script:
    - terraform destroy -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual  # Always require manual trigger for destroy
  dependencies: []
  allow_failure: true  # Optional environment

###################
# SECURITY SCANNING
###################

security:tfsec:
  stage: validate
  image:
    name: aquasec/tfsec:latest
    entrypoint: [""]
  script:
    - tfsec ${TF_ROOT} --format json --out tfsec-report.json || true
    - tfsec ${TF_ROOT} --format default
  artifacts:
    name: "tfsec-report-${CI_COMMIT_SHORT_SHA}"
    paths:
      - tfsec-report.json
    expire_in: 30 days
    reports:
      sast: tfsec-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true
